# Same run directory as training: id_dir = output_dir/run_ID. Checkpoint read
# from id_dir/outputs/models/, graph from id_dir/outputs/aux_files/, predictions
# written to id_dir/outputs/predictions/. Both keys REQUIRED (no id_dir key).
run_ID: GNN4CD
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/CORDEX-BENCH

d4p_downscaler:
  name: downscaler_custom
  module: deep4production.core.downscalers.downscaler_gnn4cd

input_data:
  paths:
  - path_to_your_x_file_1.zarr
  years: [1980]
  load_in_memory: true

ensemble_size: 1   # deterministic (Asym loss)
model_file: GNN4CD_asym_best.pt # Model at: id_dir/outputs/models/

graph:
  path: edge_index.pt
  ## Apply model to a different graph?
  # path: null
  # name: build_graph
  # module: deep4production.deep.models.gnn.GNN4CD
  # # kwargs
  # kwargs:
  #   data_high: path_to_your_new_y_file.zarr # Used to grab the lat-lon coordinates of the high-res nodes
  #   data_low: path_to_your_new_x_file.zarr # Used to grab the lat-lon coordinates of the low-res nodes
  #   # Note: self is excluded internally, so 8 means 8 distinct high neighbours.
  #   # high-to-high edges are bidirectional. Paper defaults: 8 and 9.
  #   nearest_neighbours_high_to_high: 8
  #   nearest_neighbours_low_to_high: 9

saving_info:
  file: 1980.nc # Predictions will be saved at: id_dir/outputs/predictions/
  template:
