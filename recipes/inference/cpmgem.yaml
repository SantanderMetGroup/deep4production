##### GENERAL INFO #####
# Directory created by d4p-train for the cpmgem run_ID.
# Contains:  models/  predictions/  aux_files/  metadata.json
id_dir: your_id_dir             # e.g., /outputs/cpmgem


##### INPUT DATA #####
input_data:
  paths:
  - path_to_your_x_file_1.zarr
  - path_to_your_x_file_2.zarr
  - '...'
  years: [1981, 1982, 1983]     # years to downscale
  load_in_memory: true


##### ENSEMBLE SIZE #####
# CPMGEM is stochastic — each reverse-diffusion trajectory draws fresh Gaussian
# noise, so ensemble_size > 1 produces independent realisations, useful for
# uncertainty estimation. The paper evaluates with 6 members per day.
ensemble_size: 6

graph:


##### MODEL CHECKPOINT #####
model_file: CPMGEM_best.pt      # relative to id_dir/models/


##### DOWNSCALER CLASS #####
# CPMGEM-specific subclass: replaces the deterministic forward pass with a
# reverse sub-VP SDE sampling chain (Euler-Maruyama, matching the paper).
d4p_downscaler:
  name: downscaler_custom
  module: deep4production.core.downscalers.downscaler_cpmgem
  kwargs:
    sampling_params:
      # Number of reverse SDE steps.
      # Paper value: 1000. Reduce to 200-500 for a ~2-5x speed-up at some
      # quality cost.
      num_steps: 1000
      # Deterministic (noise-free) final step — reduces residual variance and
      # produces slightly sharper outputs.
      denoise: true
      # beta_min / beta_max are read automatically from the checkpoint metadata
      # saved by trainer_cpmgem; override only if you know what you are doing.
      # t_min is decoupled from training: the trainer integrates t down to 1e-5
      # for coverage, but reverse sampling stops earlier (default 1e-3, the mlde
      # / score_sde_pytorch convention) to avoid the σ → 0 blow-up of the score
      # correction g²·ε̂/σ.
      # beta_min: 0.1
      # beta_max: 20.0
      # t_min: 1.0e-3


##### OUTPUT #####
saving_info:
  file: CPMGEM_1981-1983.nc     # saved at id_dir/predictions/
  template:                     # optional NetCDF template for coordinates
  # formatting:
  #   name: null                # e.g., cordex_ml
  #   kwargs:
  #     attributes_dict:
  #       project_id: ...


##### INFERENCE RUNTIME #####
# Forwarded as **kwargs to downscaler.downscale().
#   batch_size : number of dates whose reverse-SDE chains run in parallel on
#                the GPU (each chain shares the same num_steps iterations).
#                Increase for higher throughput; bound by GPU memory.
#   amp_dtype  : 'bfloat16' (Ampere+ recommended) / 'float16' / null.
#                Mixed-precision autocast for the score-network forward inside
#                each SDE step. Leave null to disable.
#   compile    : true wraps the score network with torch.compile(dynamic=True,
#                mode="reduce-overhead"). The 1000 inner SDE steps amortise the
#                one-shot compile cost very quickly.
inference_params:
  batch_size: 4
  amp_dtype:
  compile: false
