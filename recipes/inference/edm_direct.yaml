##### GENERAL INFO #####
# Directory created by d4p-train for the edm_direct run_ID.
# Contains:  models/  predictions/  aux_files/  metadata.json
id_dir: your_id_dir             # e.g., /outputs/edm_direct


##### INPUT DATA #####
input_data:
  paths:
  - path_to_your_x_file_1.zarr
  - path_to_your_x_file_2.zarr
  - '...'
  years: [1981, 1982, 1983]
  load_in_memory: true


##### ENSEMBLE SIZE #####
# Stochastic — each Heun sampling chain draws fresh Gaussian noise, so
# ensemble_size > 1 produces independent realisations.
ensemble_size: 6

graph:


##### MODEL CHECKPOINT #####
# EDM-preconditioned SongUNet (build_edm_model). load_model() re-invokes the
# factory from metadata, reconstructing preconditioner + backbone identically.
# No regressor — EDM-direct generates the full field in one stage.
model_file: EDM_direct_best.pt


##### DOWNSCALER CLASS #####
# EDM-direct downscaler: single-stage EDM Heun sampler (Karras et al. 2022) over
# the EDM-preconditioned SongUNet, conditioned on cond_low (predictors) and
# optional cond_high (forcings). sigma_min / sigma_max default to training metadata.
d4p_downscaler:
  name: downscaler_custom
  module: deep4production.core.downscalers.downscaler_edm_direct
  kwargs:
    sampling_params:
      num_steps: 18              # EDM/CorrDiff default
      # sigma_min / sigma_max read automatically from training metadata.
      # sigma_min: 0.002
      # sigma_max: 80.0
      rho: 7.0                   # EDM noise-schedule curvature
      # Stochastic churn (Alg. 2); S_churn=0 → deterministic Heun (recommended).
      S_churn: 0.0
      S_min: 0.0
      S_max: .inf
      S_noise: 1.0


##### OPTIONAL: high-res forcings (must match the training recipe) #####
# Only needed if the model was TRAINED with forcings (data.forcings +
# cond_high_channels = C_f). Routed to the backbone's cond_high stream; norm_f is
# restored automatically from training metadata.
# forcing_data:
#   paths:
#   - path_to_your_forcing.zarr   # e.g. orography at predictand resolution
#   years: [1981, 1982, 1983]
#   # format: auto


##### OUTPUT #####
saving_info:
  file: EDM_direct_1981-1983.nc   # saved at id_dir/predictions/
  template:
  # formatting:
  #   name: null
  #   kwargs:
  #     attributes_dict:
  #       project_id: ...


##### INFERENCE RUNTIME #####
# Forwarded as **kwargs to downscaler.downscale().
#   batch_size : number of dates whose Heun chains run in parallel on the GPU.
#   amp_dtype  : 'bfloat16' (Ampere+ recommended) / 'float16' / null.
#   compile    : true wraps the EDM model with torch.compile.
inference_params:
  batch_size: 4
  amp_dtype:
  compile: false
