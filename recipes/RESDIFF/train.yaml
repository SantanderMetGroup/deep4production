##### GENERAL INFO #####
# run_ID is this run's directory name and output_dir is its parent, so
# id_dir = output_dir/run_ID is the directory holding this recipe. d4p-train
# writes every generated artifact under id_dir/outputs/ (models/, aux_files/,
# predictions/, tracker/). Both keys are REQUIRED.
run_ID: RESDIFF
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/TROPICAL-BENCH
overwrite: true


##### TRAINER SELECTION #####
# EDM residual-diffusion trainer (CorrDiff-style, Mardani et al. 2023).
# Predicts the residual r = y - mean_pred where mean_pred is the output of a
# separately trained deterministic regressor.
d4p_trainer:
  name: trainer_custom
  module: deep4production.core.trainers.trainer_resdiff


##### CUSTOM PYDATASET #####
# Residual pydataset: loads predictors + predictands, runs the deterministic
# regressor at init, caches residuals + regression means to a zarr, and
# serves (r, c_low, c_high) triples. c_high is the regression mean.
d4p_pydataset:
  name: pydataset_custom
  module: deep4production.core.pydatasets.pydataset_resdiff
  kwargs:
    # Path to the deterministic regressor checkpoint (d4p-format .pt file).
    # Used to compute y_hat = regressor(x); the residual r = y - y_hat is the
    # diffusion target, and y_hat itself is fed back as the high-res context.
    # Regressor checkpoint from a separate deterministic run's outputs/models/,
    # e.g. <output_dir>/SONG_UNET_DET_ASYM/outputs/models/SongUNet_det_asym_best.pt
    path_regressor: path/to/your/project/REGRESSOR_RUN/outputs/models/regressor_best.pt
    # Pass the regressor's mean prediction to the diffusion UNet as cond_high.
    # Must stay `true` for CorrDiff; setting `false` falls back to
    # low-res-only conditioning (not the published CorrDiff configuration).
    add_pred_mean: true
    # Also feed the raw low-res predictors to the UNet as cond_low.
    add_context_lowres: true
    # Per-channel standardize the residual target to ~unit variance so the
    # diffusion sees data with sigma_data = 1 (the CorrDiff / EDM convention).
    # The standardization stats are persisted to the run metadata and inverted
    # by the downscaler at inference. Must match sigma_data below (= 1).
    standardize_residuals: true
    # Residuals cache (written once on first run, reused thereafter). Keep it
    # inside this run's own outputs/aux_files/ so everything lives under id_dir.
    residuals:
      path: path/to/your/project/RESDIFF/outputs/aux_files/residuals.zarr
      template: path_to_your_target_template.nc


##### TRAINING DATA CONFIGURATION #####
data:
  load_in_memory: true
  training_period: [1961, 1962, 1963, 1964, 1965, 1966, 1968, 1969, 1970, 1971, 1972, 1973, 1974, 1976, 1977, 1978, 1979]
  validation_period: [1967, 1975]

  predictors:
    paths:
    - path_to_your_x_file_1.zarr
    - path_to_your_x_file_2.zarr
    - '...'
    variables:
    normalizer:
      path_reference: path_to_your_x_file_1.zarr
      default: mean_std
    transform_to_2D: true

  predictands:
    paths:
    - path_to_your_y_file_1.zarr
    - path_to_your_y_file_2.zarr
    - '...'
    variables:
    - pr
    transform_to_2D: true


##### DATA LOADER CONFIGURATION #####
dataloader:
  batch_size: 16
  shuffle: true
  num_workers: 4


##### MODEL CONFIGURATION #####
model_info:
  saving_params:
    model_save_name: ResDiff

  # ── Loss ────────────────────────────────────────────────────────────────────
  # EDM-weighted DSM on the *denoised* prediction D_theta returned by the
  # preconditioner. Loss weighting lambda(sigma) = (sigma_data^2 + sigma^2) /
  # (sigma_data * sigma)^2; no c_skip/c_out inside — the preconditioner owns
  # those. `sigma_data` must match the preconditioner's value.
  loss_params:
    name: WeightedDenoisingScoreMatchingLoss
    module: deep4production.deep.loss
    kwargs:
      ignore_nans: false
      sigma_data: 1             # standardized residuals → unit variance

  # ── Architecture ─────────────────────────────────────────────────────────────
  # EDM preconditioner wrapping the shared SongUNet backbone. The factory
  # `build_edm_model` instantiates the backbone from the nested `backbone`
  # spec and wraps it — single flat YAML entry, but full configurability.
  # The same metadata block is reloaded at inference by load_model (and by the
  # CorrDiff downscaler), so train/inference stay in lockstep.
  model_params:
    name: build_edm_model
    module: deep4production.deep.models.diffusion.edm_precond
    kwargs:
      sigma_data: 1               # EDM data sigma (must match loss.sigma_data)
      backbone:
        module: deep4production.deep.models.unet.song_unet
        name: SongUNet
        kwargs:
          # ── Whole-domain (default) channel layout ──
          # For patch-based diffusion (see the `patching:` block under
          # training_params) the layout MUST change to:
          #     cond_low_channels: 0                 # all conditioning via cond_high
          #     cond_high_channels: C_y + 2*C_x      # [mean_hr | img_lr_hr | global_lr]
          #     spatial_pe_freqs: >= 1               # global positional embedding
          # e.g. C_y=1, C_x=12 → cond_high_channels: 25, cond_low_channels: 0.
          in_channels: 1            # C_r  — channels of the residual (= C_y)
          cond_low_channels: 12     # C_x  — coarse ERA5 / predictor channels
          cond_high_channels: 1     # C_yhat — regression mean as high-res context
          nf: 128                   # base width (CorrDiff paper: ~80 M params at nf=128)
          ch_mult: [1, 2, 2, 2, 2]  # 5 encoder levels (CorrDiff paper)
          num_res_blocks: 4
          attn_at_levels: [3, 4]    # attention at the two deepest levels
          dropout: 0.13             # CorrDiff paper value
          fir: true
          fir_kernel: [1, 3, 3, 1]
          skip_rescale: true
          progressive_input: true
          cond_upsample: fir        # anti-aliased upsampling of coarse inputs
          # NeRF-style spatial positional embedding (Mardani et al. 2023).
          # K=1 → 4 extra channels: sin/cos(2π·y/H), sin/cos(2π·x/W) (CorrDiff paper).
          # K>1 → 4·K channels with geometrically increasing frequencies.
          # K=0 disables. The PE is a pure function of (H, W), cached on the
          # first forward, so the per-step cost is a single concat.
          spatial_pe_freqs: 1

  # ── Training ──────────────────────────────────────────────────────────────────
  training_params:
    num_epochs: 300
    patience_early_stopping: 20
    optimizer_params:
      lr: 0.0002
    ema_decay: 0.9999
    grad_clip: 1.0

    scheduler_params:
      type: LambdaLR
      lr_lambda: rampup_expdecay
      kwargs:
        base_lr: 0.0002
        rampup_steps: 5000
        decay_rate: 1.0
        decay_interval: 1
        terminal_value: 1.0e-6

    # Forwarded as **kwargs to model_backprop.
    # EDM log-normal noise sampling (Karras et al. 2022):
    #   ln(sigma) ~ N(P_mean, P_std^2), clamped to [sigma_min, sigma_max].
    kwargs:
      noise_params:
        P_mean: -1.2              # EDM default
        P_std: 1.2                # EDM default
        sigma_min: 0.002          # EDM default
        sigma_max: 80.0           # EDM default

    # ── OPTIONAL: CorrDiff-style patch-based (multi-)diffusion ─────────────────
    # For domains that do not fit a single GPU. The residual is trained on random
    # P×P patches (bounded memory); inference (downscaler_resdiff) tiles the full
    # domain and FUSES every EDM Heun step so patches stay globally coherent. The
    # geometry below is persisted to the run metadata, so the downscaler needs no
    # patching keys of its own.
    #
    # When enabled, update the backbone channels (see note above):
    #     cond_low_channels: 0
    #     cond_high_channels: C_y + 2*C_x   (= [mean_hr | img_lr_hr | global_lr])
    #     spatial_pe_freqs:  >= 1           (global positional embedding per patch)
    # and keep add_pred_mean / add_context_lowres = true (both feed the patch).
    # patch_shape_{x,y} must be a multiple of 2^(len(ch_mult)-1). Choose it from
    # the residual auto-correlation length (spec §6), not just "fits in memory".
    #
    # patching:
    #   enabled: true
    #   patch_shape_y: 128
    #   patch_shape_x: 128
    #   overlap_pix: 4          # raw-pixel overlap between neighbouring patches
    #   boundary_pix: 2         # discarded rim at fusion (overlap_pix >= boundary_pix)
    #   patch_num: 8            # random patches per image per training step

    # ── OPTIONAL: reflection padding for non-divisible domains ────────────────
    # H_y and W_y must both be multiples of 2^(len(ch_mult)-1) (e.g. EUR-12i
    # 341x352: 341 is odd). When set, the noisy residual is drawn on the padded
    # grid and D_theta is cropped back BEFORE the EDM loss, so the padded rim
    # contributes no gradient. The diffusion and the regressor pad independently:
    # this key covers the diffusion, and the regressor's own `padding` metadata is
    # replayed when building the residuals and at inference. Persisted to metadata
    # (inference needs no padding keys). Mutually exclusive with `patching`.
    #
    # pad_to_multiple: 16   # 341x352 -> 352x352 (pad 5 top / 6 bottom)
