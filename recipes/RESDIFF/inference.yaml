##### GENERAL INFO #####
# Same run directory as training: id_dir = output_dir/run_ID. The checkpoint is
# read from id_dir/outputs/models/ and predictions are written to
# id_dir/outputs/predictions/. run_ID and output_dir must match the train.yaml
# used for this run. Both keys are REQUIRED (there is no standalone id_dir key).
run_ID: RESDIFF
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/TROPICAL-BENCH


##### INPUT DATA #####
input_data:
  paths:
  - path_to_your_x_file_1.zarr
  - path_to_your_x_file_2.zarr
  - '...'
  years: [1981, 1982, 1983]
  load_in_memory: true


##### ENSEMBLE SIZE #####
# CorrDiff is stochastic — each reverse-diffusion trajectory draws fresh
# Gaussian noise, so ensemble_size > 1 produces independent realisations.
ensemble_size: 6

graph:


##### MODEL CHECKPOINT #####
# Metadata inside the checkpoint holds:
#   model_params.name   = build_edm_model
#   model_params.module = deep4production.deep.models.diffusion.edm_precond
#   model_params.kwargs = { sigma_data, backbone: { module, name, kwargs } }
# load_model() re-invokes the factory, so the preconditioner + backbone are
# reconstructed identically at inference without any extra wiring here.
model_file: ResDiff_best.pt


##### DOWNSCALER CLASS #####
# ResDiff / CorrDiff-specific downscaler:
#   1. Loads the regressor (from `path_regressor` saved in training metadata
#      by trainer_resdiff, or the optional override below).
#   2. For each date: runs regressor(x) → y_hat, then draws r_hat from the
#      EDM Heun sampler (Karras et al. 2022) on the EDM-preconditioned
#      SongUNet.
#   3. Returns y_hat + r_hat as the final downscaled prediction; the
#      downscaler denormalises (self.norm_y.inverse_transform) on the GPU
#      before the D2H copy, then _postprocess_numpy applies the operator inverse.
# sigma_min / sigma_max default to the values stored in training metadata.
d4p_downscaler:
  name: downscaler_custom
  module: deep4production.core.downscalers.downscaler_resdiff
  kwargs:
    # Optional: override the regressor path stored in training metadata
    # (useful if the checkpoint was moved after training).
    # path_regressor: /new/path/to/regressor_best.pt
    sampling_params:
      # EDM Heun sampler (Karras et al. 2022).
      num_steps: 18              # paper default for CorrDiff
      # sigma_min / sigma_max read automatically from training metadata;
      # override here only if you have a specific reason to.
      # sigma_min: 0.002
      # sigma_max: 80.0
      rho: 7.0                   # EDM noise-schedule curvature
      # Stochastic churn parameters (Alg. 2 in Karras et al.).
      # S_churn=0 → deterministic Heun sampler (recommended baseline).
      S_churn: 0.0
      S_min: 0.0
      S_max: .inf
      S_noise: 1.0


##### OUTPUT #####
saving_info:
  file: ResDiff_1981-1983.nc     # saved at id_dir/outputs/predictions/
  template:
  # formatting:
  #   name: null
  #   kwargs:
  #     attributes_dict:
  #       project_id: ...


##### INFERENCE RUNTIME #####
# Forwarded as **kwargs to downscaler.downscale().
#   batch_size : number of dates whose Heun sampling chains run in parallel
#                on the GPU (each chain shares the same num_steps iterations).
#                Increase for higher throughput; bound by GPU memory. NOTE: for a
#                patch-trained run each step also runs `patch_num_full` patches
#                per date (the full-domain grid), so effective GPU work per step
#                is batch_size × patch_count — lower batch_size accordingly.
#
# PATCHING: if the run was trained with a `patching:` block, the diffusion is
# tiled + fused every sampler step and (if the regressor was also patched) the
# regressor mean is tiled too. All geometry is read from training metadata —
# there are NO patching keys to set here.
#   amp_dtype  : 'bfloat16' (Ampere+ recommended) / 'float16' / null.
#                Mixed-precision autocast for the score-network forward inside
#                each Heun step. Leave null to disable.
#   compile    : true wraps the EDM model with torch.compile(dynamic=True,
#                mode="reduce-overhead"); the regressor is NOT compiled (one-shot
#                pass, not worth the warm-up cost). The 18 inner Heun steps
#                amortise the compile cost per date batch.
inference_params:
  batch_size: 4
  amp_dtype:
  compile: false
