##### GENERAL INFO #####
run_ID: edm_direct
output_dir: path_to_your_output_dir
overwrite: true


##### TRAINER SELECTION #####
# EDM-direct: the EDM × direct cell of the 2x2 decoupling study. Generates the
# full normalized field directly (no regressor, no residual) with the EDM/CorrDiff
# diffusion formulation — the EDM analogue of CPMGEM. Uses the standard pydataset
# (x, y, f); no d4p_pydataset block needed.
d4p_trainer:
  name: trainer_custom
  module: deep4production.core.trainers.trainer_edm_direct


##### TRAINING DATA CONFIGURATION (uses pre-computed zarr files) #####
data:
  load_in_memory: true
  training_period: [1961, 1962, 1963, 1964, 1965, 1966, 1968, 1969, 1970, 1971, 1972, 1973, 1974, 1976, 1977, 1978, 1979]
  validation_period: [1967, 1975]

  predictors:
    paths:
    - path_to_your_x_file_1.zarr
    - path_to_your_x_file_2.zarr
    - '...'
    variables:
    normalizer:
      path_reference: path_to_your_x_file_1.zarr
      default: mean_std
    transform_to_2D: true

  predictands:
    paths:
    - path_to_your_y_file_1.zarr
    - path_to_your_y_file_2.zarr
    - '...'
    variables:
    - pr
    # Direct full-field target. sqrt(pr) → [-1, 1] keeps the data at ~unit scale,
    # which sigma_data (below) is matched to. Operator applied first, then norm.
    operator:
      default: sqrt
    normalizer:
      path_reference: path_to_your_y_file_1.zarr
      default: minmax_neg1_1
    transform_to_2D: true

  # ── OPTIONAL: high-res forcings (e.g. orography) as cond_high ─────────────────
  # Routed to the EDM backbone's cond_high stream (the model conditions on
  # cond_low predictors + cond_high forcings). To enable: uncomment, set
  # cond_high_channels = C_f below, and add a matching `forcing_data` block to the
  # inference recipe.
  # forcings:
  #   variables:
  #   - orog
  #   operator:
  #     default: none
  #   normalizer:
  #     path_reference: path_to_your_y_file_1.zarr
  #     default: mean_std


##### DATA LOADER CONFIGURATION #####
dataloader:
  batch_size: 16
  shuffle: true
  num_workers: 4


##### MODEL CONFIGURATION #####
model_info:
  saving_params:
    model_save_name: EDM_direct

  # ── Loss ────────────────────────────────────────────────────────────────────
  # EDM-weighted DSM on the denoised D_theta from the preconditioner.
  # sigma_data must match the preconditioner's value.
  loss_params:
    name: WeightedDenoisingScoreMatchingLoss
    module: deep4production.deep.loss
    kwargs:
      ignore_nans: false
      sigma_data: 0.5

  # ── Architecture ─────────────────────────────────────────────────────────────
  # EDM preconditioner wrapping the shared SongUNet backbone (build_edm_model),
  # operating on the full field. cond_high_channels = 0 (no regressor mean; set to
  # C_f only if forcings are enabled above).
  #
  # STUDY NOTE: for a clean 2x2 comparison, keep the backbone capacity
  # (nf / ch_mult / num_res_blocks / attn) matched to the cell(s) you compare
  # against (CPMGEM-direct for the formulation axis; the EDM-residual cell for the
  # target axis). The three clean-2x2 cells (CPMGEM, CPMGEM-residual, EDM-direct)
  # share this predictand convention (sqrt + minmax_neg1_1, sigma_data ~ 0.5).
  # ResDiff is intentionally kept on CorrDiff's native std normalization, so it is
  # a faithful-CorrDiff baseline rather than the normalization-matched EDM-residual
  # corner — keep that in mind when reading the target-axis comparison.
  model_params:
    name: build_edm_model
    module: deep4production.deep.models.diffusion.edm_precond
    kwargs:
      sigma_data: 0.5             # EDM data sigma (must match loss.sigma_data)
      backbone:
        module: deep4production.deep.models.unet.song_unet
        name: SongUNet
        kwargs:
          in_channels: 1            # C_y — full target field channels
          cond_low_channels: 12     # C_x — coarse predictor channels
          cond_high_channels: 0     # 0 (no regressor mean); = C_f if forcings on
          nf: 128
          ch_mult: [1, 2, 2, 2, 2]
          num_res_blocks: 4
          attn_at_levels: [3, 4]
          dropout: 0.13
          fir: true
          fir_kernel: [1, 3, 3, 1]
          skip_rescale: true
          progressive_input: true
          cond_upsample: fir
          spatial_pe_freqs: 1

  # ── Training ──────────────────────────────────────────────────────────────────
  training_params:
    num_epochs: 300
    patience_early_stopping: 20
    optimizer_params:
      lr: 0.0002
    ema_decay: 0.9999
    grad_clip: 1.0

    scheduler_params:
      type: LambdaLR
      lr_lambda: rampup_expdecay
      kwargs:
        base_lr: 0.0002
        rampup_steps: 5000
        decay_rate: 1.0
        decay_interval: 1
        terminal_value: 1.0e-6

    # Forwarded as **kwargs to model_backprop.
    # EDM log-normal noise sampling (Karras et al. 2022):
    #   ln(sigma) ~ N(P_mean, P_std^2), clamped to [sigma_min, sigma_max].
    kwargs:
      noise_params:
        P_mean: -1.2              # EDM default
        P_std: 1.2                # EDM default
        sigma_min: 0.002          # EDM default
        sigma_max: 80.0           # EDM default
