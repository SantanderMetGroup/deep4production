##### GENERAL INFO #####
run_ID: deepesd_mse # example
output_dir: path_to_your_output_dir
overwrite: true # trains deep learning model from scratch even if a model already exists in output dir


##### TRAINING DATA CONFIGURATION (uses pre-computed zarr files) #####
data:
  load_in_memory: true # Load all data in memory for training (speeds up training if enough RAM is available)
  training_period: [1961, 1962, 1963, 1964, 1965, 1966, 1968, 1969, 1970, 1971, 1972, 1973, 1974, 1976, 1977, 1978, 1979, 2080, 2080, 2081, 2082, 2083, 2084, 2085, 2086, 2088, 2089, 2090, 2091, 2092, 2093, 2094, 2096, 2097, 2098, 2099]
  validation_period: [1967, 1975, 2087, 2095]

  predictors:
    paths:
    - path_to_your_x_file_1.zarr
    - path_to_your_x_file_2.zarr
    - '...'
    variables:       # If null, uses all variables available in the zarrs.
    normalizer:
      path_reference: path_to_your_x_file_1.zarr
      default: mean_std # Applies this type of standardization to all the variables in the predictor set
    transform_to_2D: true

  predictands:
    paths:
    - path_to_your_y_file_1.zarr
    - path_to_your_y_file_2.zarr
    - '...'
    variables:
    - tasmax
    transform_to_2D: true


##### DATA LOADER CONFIGURATION #####
dataloader:
  batch_size: 64
  shuffle: false
  num_workers: 0


##### HARDWARE / DATA-PARALLEL CONFIGURATION (optional) #####
# Omit this block (or keep num_nodes=1 and gpus_per_node=1) for plain
# single-GPU / CPU training — behavior is identical to before.
# When num_nodes * gpus_per_node > 1, the trainer wraps the model in
# DistributedDataParallel and shards the dataloader with DistributedSampler.
# Launch the training via SLURM, e.g.:
#   srun --nodes=2 --ntasks-per-node=4 --gres=gpu:4 d4p-train recipe.yaml
# The ``batch_size`` above is the per-GPU local batch size, so the global
# batch size becomes batch_size * num_nodes * gpus_per_node.
hardware:
  num_nodes: 1
  gpus_per_node: 1
  # master_port: 29500  # optional; only honored under SLURM if MASTER_PORT is unset


##### REGRESSOR CONFIGURATION #####
model_info:
  saving_params:
    model_save_name: DeepESD_Mse
  loss_params:
    name: MseLoss
    module: deep4production.deep.loss
    # kwargs (loss function)
    kwargs:
      ignore_nans: true
  model_params:
    name: DeepESD
    module: deep4production.deep.models.cnn.DeepESD
    # kwargs model
    kwargs:
      x_shape: [15, 16, 16] # (C, H, W). Use `d4d-datasets-inspect your_zarr_file` to get this value
      y_shape: [1, 128, 128] # (C, H, W). Use `d4d-datasets-inspect your_zarr_file` to get this value
      filters: [50, 25, 10]
      kernel_size: 3
  training_params:
    num_epochs: 1000
    patience_early_stopping: 30
    optimizer_params:
      lr: 0.0001


##### MONITORING: d4p-tracker (in-house, no external server) #####
# In-house training monitor — a dependency-free alternative to MLflow.
# Writes figures + CSV to <output_dir>/<run_ID>/tracker/ on the local
# filesystem. d4p-tracker and the `Mlflow` block are MUTUALLY EXCLUSIVE:
# configure at most one of them (training aborts if both are present).
#
# Produces three monitors:
#   * tracker/loss_curve.png + losses.csv         — train/val loss per epoch
#   * tracker/metrics/<diag>_<var>.png + .csv      — per-gridpoint min/mean/max
#       evolution: each logged epoch is drawn as a vertical min->max line with
#       a mean marker (only 3 scalars/epoch are persisted, never the fields)
#   * tracker/maps/<var>/epoch_XXXX_<date>.png     — ground-truth vs prediction
#       maps for a few random (but fixed across epochs) validation dates
tracker:
  # How often (in epochs) to run the metric/map diagnostics. Loss curves are
  # refreshed every epoch regardless (they are cheap).
  compute_diagnostics_every_n_epochs: 10

  # --- Per-gridpoint metric evolution (min/mean/max markers) ---
  # Each entry is one of:
  #   * a diagnostic name from deep4production.utils.diagnostics, called with
  #     spatial=True            ->  e.g.  rmse
  #   * an [index, diagnostic] pair, where `index` summarises the field first
  #                             ->  e.g.  [Mean, bias]  (bias of the time-mean)
  #   * a dict, the only form exposing `abs` and a `name` override
  #                             ->  {diagnostic: bias, index: Mean, abs: true}
  # `abs: true` takes |field| per gridpoint BEFORE the min/mean/max reduction,
  # so the mean marker is the mean absolute error rather than the mean signed
  # error (where positive/negative biases would cancel). `default` applies to
  # every predictand; add a per-variable key (e.g. `tasmax:`) to extend it.
  metrics:
    default:
      - [Mean, bias]                              # signed bias of the time-mean
      - {diagnostic: bias, index: Mean, abs: true}  # mean |bias| (no cancelling)
      - [Mean, relbias]                           # relative bias (%) of the mean
      - rmse                                      # per-gridpoint RMSE
    # tasmax:
    #   - [P98, bias]     # bias of the 98th percentile, per gridpoint

  # --- Random-date ground-truth vs prediction maps ---
  maps:
    num_dates: 3          # how many validation dates to plot
    seed: 42              # fixed seed -> same dates every epoch (comparable)
    diff: true            # add a (prediction - ground truth) difference panel
    cmap: YlGnBu
