##### GENERAL INFO #####
# run_ID is this run's directory name and output_dir is its parent, so
# id_dir = output_dir/run_ID is the directory holding this recipe. d4p-train
# writes every generated artifact under id_dir/outputs/ (models/, aux_files/,
# predictions/, tracker/). Both keys are REQUIRED.
run_ID: SONG_UNET_DET_ASYM
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/TROPICAL-BENCH
overwrite: true


##### TRAINER SELECTION #####
# Deterministic SongUNet trainer: bypasses diffusion by setting x_in=0, t=0
# and conditioning the UNet exclusively through cond_low (the low-res predictor).
d4p_trainer:
  name: trainer_custom
  module: deep4production.core.trainers.trainer_song_unet_det


##### TRAINING DATA CONFIGURATION #####
data:
  load_in_memory: true
  training_period: [1961, 1962, 1963, 1964, 1965, 1966, 1968, 1969, 1970, 1971, 1972, 1973, 1974, 1976, 1977, 1978, 1979]
  validation_period: [1967, 1975]

  predictors:
    paths:
    - path_to_your_x_file_1.zarr
    - path_to_your_x_file_2.zarr
      # Add more zarr files if predictors come from multiple sources
    variables:       # null → use all variables present in the zarrs
    normalizer:
      path_reference: path_to_your_x_file_1.zarr  # zarr used to compute stats
      default: mean_std  # standardise each variable to zero mean / unit variance
    transform_to_2D: true  # reshape flattened gridpoints → (C, H_x, W_x) grid

  predictands:
    paths:
    - path_to_your_y_file.zarr
    variables:
    - pr    # single precipitation variable — Asym loss only supports C_y = 1
    # No operator / normalizer: the Asym loss fits a Gamma distribution directly
    # on the raw precipitation values and evaluates the CDF in physical space.
    # Adding a transform here would invalidate those Gamma parameters.
    transform_to_2D: true  # reshape → (1, H_y, W_y); required by SongUNet


##### DATA LOADER CONFIGURATION #####
# pin_memory (default: true on CUDA) and persistent_workers (default: true
# when num_workers > 0) are enabled automatically by the trainer; override
# here if needed.
dataloader:
  batch_size: 32   # reduce to 16 if GPU memory is tight
  shuffle: true
  num_workers: 4


##### MODEL CONFIGURATION #####
model_info:

  saving_params:
    model_save_name: SongUNet_det_asym
    save_every_n_epochs: 50   # periodic checkpoint in addition to best

  # ── Loss ──────────────────────────────────────────────────────────────────
  # Asymmetric loss (Asym): MAE + CDF-weighted term that penalises
  # under-prediction of extreme precipitation events.
  #   asym_weight : relative weight of the CDF-weighted term vs. MAE
  #   cdf_pow     : exponent applied to the Gamma CDF → higher values give
  #                 more weight to the upper tail (extremes)
  #   threshold   : wet-day threshold in mm/day for the Gamma fit
  #   type        : "full" fits one Gamma per gridpoint over the whole period;
  #                 "per_year" averages year-by-year fits (more robust if the
  #                 training record is long)
  loss_params:
    name: Asym
    module: deep4production.deep.loss
    kwargs:
      ref_path: path_to_your_y_file.zarr   # same zarr as predictands
      var: pr
      type: full
      asym_path: path/to/your/project/SONG_UNET_DET_ASYM/outputs/aux_files/
      asym_weight: 1.0
      cdf_pow: 2.0
      threshold: 1.0   # mm/day — standard wet-day definition
      appendix:        # optional suffix for the cached Gamma parameter files
      ignore_nans: true

  # ── Architecture ──────────────────────────────────────────────────────────
  # SongUNet (NCSN++ backbone, Song et al. 2021 / Addison et al. 2024).
  # Used deterministically: the noisy-input slot (in_channels) receives zeros,
  # and the network conditions only on the low-res predictor (cond_low_channels).
  #
  #   in_channels        : must equal C_y (number of predictand variables = 1)
  #   cond_low_channels  : total number of predictor channels across all zarrs
  #                        → run `d4p-inspect your_x.zarr` to get this value
  #   nf                 : base channel width; 64 is lighter than the diffusion
  #                        setting (128) and sufficient for deterministic tasks
  #   ch_mult            : 4-level encoder; H_y and W_y must be divisible by 8
  #   attn_at_levels     : attention at the two deepest levels
  #   spatial_pe_freqs   : 1 adds 4 sinusoidal spatial channels (NeRF-style),
  #                        helping the model encode absolute grid position;
  #                        set to 0 to disable
  model_params:
    name: SongUNet
    module: deep4production.deep.models.unet.song_unet
    kwargs:
      in_channels: 1             # C_y — number of predictand variables
      cond_low_channels: 15      # C_x — total predictor channels (d4p-inspect)
      cond_high_channels: 0      # no high-res conditioning in the deterministic setup
      nf: 64                     # base channel width
      ch_mult: [1, 2, 2, 2]      # channel multipliers per encoder level
      num_res_blocks: 2          # ResBlocks per encoder/decoder level
      attn_at_levels: [2, 3]     # levels (0-indexed) with self-attention
      dropout: 0.1
      fir: true                  # FIR-filtered up/downsampling inside ResBlocks
      fir_kernel: [1, 3, 3, 1]
      skip_rescale: true
      progressive_input: true    # add downsampled input at each encoder level
      cond_upsample: nearest     # how to upsample cond_low to H_y × W_y
      spatial_pe_freqs: 1        # 1 → 4 sinusoidal grid-position channels

  # ── Training ──────────────────────────────────────────────────────────────
  training_params:
    num_epochs: 1000
    patience_early_stopping: 30
    grad_clip: 1.0               # L2-norm gradient clipping
    # Mixed precision (AMP). Uses bf16 on Ampere+ (A100/H100) — no GradScaler
    # needed; falls back to fp16 + GradScaler on older GPUs. ~1.5–2× speedup
    # and roughly half the activation memory on large UNets.
    amp: true
    # torch.compile (PyTorch >= 2.0). JIT-compiles the model with TorchInductor.
    # First epoch is slow (kernel compilation); all subsequent epochs are faster.
    # Modes: true / "default"        – good all-around choice
    #        "reduce-overhead"       – CUDA graphs; best for fixed batch shapes
    #        "max-autotune"          – most aggressive; very long first epoch
    # Combine with amp: true for maximum throughput.
    compile: false
    optimizer_params:
      lr: 0.0001
    ema_decay: 0.9999            # exponential moving average of weights
    scheduler_params:
      type: ReduceLROnPlateau
      kwargs:
        mode: min
        factor: 0.5
        patience: 15
        min_lr: 1.0e-6

    # ── OPTIONAL: CorrDiff-style patch-based training (large-domain tiling) ────
    # Trains the regressor on random P×P patches so it can be tiled at inference
    # (apply→forward→fuse); this is how the resdiff pydataset/downscaler tile a
    # patched regressor. When enabled, change the backbone channels to:
    #     cond_low_channels: 0
    #     cond_high_channels: 2*C_x + C_f   (= [img_lr_hr | forcing_hr | global_lr])
    #     spatial_pe_freqs:  >= 1           (global positional embedding per patch)
    # and note patch_shape_{x,y} must be a multiple of 2^(len(ch_mult)-1).
    #
    # IMPORTANT: patched training needs a SPATIALLY-INVARIANT loss (MseLoss /
    # MaeLoss). The Asym loss above carries per-gridpoint Gamma parameters tied to
    # the full grid and cannot be cropped to random patches — swap it for MseLoss.
    #
    # patching:
    #   enabled: true
    #   patch_shape_y: 128
    #   patch_shape_x: 128
    #   overlap_pix: 4
    #   boundary_pix: 2
    #   patch_num: 8
