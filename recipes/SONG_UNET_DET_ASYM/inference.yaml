##### GENERAL INFO #####
# Same run directory as training: id_dir = output_dir/run_ID. Under
# id_dir/outputs/ the downscaler reads/writes:
#   models/      — SongUNet_det_asym_best.pt  (and optional epoch checkpoints)
#   predictions/ — output NetCDF files written here
#   aux_files/   — cached Gamma parameters (shape.npy, scale.npy, loc.npy)
# run_ID and output_dir must match the train.yaml used for this run. Both keys
# are REQUIRED (there is no standalone id_dir key).
run_ID: SONG_UNET_DET_ASYM
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/TROPICAL-BENCH


##### INPUT DATA #####
input_data:
  paths:
  - path_to_your_x_file_1.zarr
  - path_to_your_x_file_2.zarr
    # Must match the zarr files used at training time (same variables and order)
  years: [1980, 1981]   # years to downscale
  load_in_memory: true


##### ENSEMBLE SIZE #####
# The deterministic SongUNet produces a single output per date.
# Setting ensemble_size > 1 re-runs the same forward pass (all members are
# identical), which is only useful for debugging. Keep this at 1 for production.
ensemble_size: 1

graph:


##### PHYSICAL BOUNDS (optional) #####
# Per-variable clamp applied in physical space at the end of postprocessing
# (after the deoperator), for variables with hard physical limits the model can
# overshoot. Each entry is [min, max]; use null on either side for a one-sided
# clamp. Variable names must match vars_y. A per-file summary of how many cells
# were clamped (and the raw min/max) is logged. Omit the block to disable.
# physical_bounds:
#   hurs: [0, 100]        # relative humidity (%)
#   sfcWind: [0, null]    # wind speed: non-negative, no upper bound


##### MODEL CHECKPOINT #####
model_file: SongUNet_det_asym_best.pt   # relative to id_dir/outputs/models/


##### DOWNSCALER CLASS #####
# Custom subclass that wires the SongUNet signature (x_in=0, t=0, cond_low=x)
# instead of the default (x, f) used by CNN-based downscalers.
d4p_downscaler:
  name: downscaler_custom
  module: deep4production.core.downscalers.downscaler_song_unet_det


##### OUTPUT #####
saving_info:
  file: SongUNet_det_asym_1980-1981.nc   # saved at id_dir/outputs/predictions/
  template:       # optional NetCDF template for output coordinates;
                  # if null, lats/lons are taken from the checkpoint metadata
  # formatting:
  #   name: cordex_ml   # uncomment to apply CORDEX-ML output conventions
  #   kwargs:
  #     attributes_dict:
  #       project_id: CORDEX-ML
