# Gradient input-attribution (XAI) for a deterministic SongUNet regressor
# (e.g. the UNet / UNet-MultiVar baselines).
# Run with:  d4p-explain ./explain.yaml   (from this SONG_UNET_DET_ASYM run directory)
#
# Same run directory as training: id_dir = output_dir/run_ID. The checkpoint is
# read from id_dir/outputs/models/ and maps are written to id_dir/outputs/xai/.
# Both keys are REQUIRED (there is no standalone id_dir key).
run_ID: SONG_UNET_DET_ASYM
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/CORDEX-BENCH

input_data:
  paths:
  - path_to_your_x_file.zarr     # UPSRCM*.zarr (perfect) or GCM*.zarr (imperfect)
  years: [1980]
  load_in_memory: false

graph:
ensemble_size: 1

model_file: SongUNet_det_asym_best.pt   # Model at: id_dir/outputs/models/

saving_info:
  file: xai_1980.nc              # Saved at: id_dir/outputs/xai/
  template: path_to_your_template.nc   # Optional; masks NaN gridpoints in the target region

# Deterministic SongUNet forward: model(x=zeros, t=0, cond_low=predictors).
d4p_explainer:
  name: ExplainerSongUNetDet
  module: deep4production.core.explainers.explainer_song_unet_det

explain_params:
  method: gradient
  target_var: tasmax             # required when the model predicts several variables
  reduction: mean                # mean | sum
  input_space: normalized        # normalized | raw
  target_space: physical         # physical | model
  percent: true
  batch_size: 32
  target_region:
    type: box
    i: [40, 88]
    j: [40, 88]
