# DeepESD inference with CORDEX-style output.
#
# Same run directory as training: id_dir = output_dir/run_ID. Both keys REQUIRED
# (no standalone id_dir key). Must match this variant's train.yaml.
#
# The only difference from inference.yaml is the `saving_info` block: instead of
# one monolithic .nc, predictions are written the way the CORDEX archive stores
# them — one file per variable, in aligned multi-year chunks. Each chunk is
# flushed and freed as soon as its dates are done, so peak memory is one chunk
# rather than the whole run (the reason long multi-member jobs used to OOM).
run_ID: DEEPESD_MSE
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/CORDEX-BENCH

input_data:
  paths:
  - path_to_your_x_file_1.zarr
  - path_to_your_x_file_2.zarr
  - '...'
  years: [1980, 1981, 1982, 1983, 1984, 1985, 1986]
  load_in_memory: true

graph:
ensemble_size: 1

model_file: DeepESD_Mse_best.pt # Model at: id_dir/outputs/models/

saving_info:
  # `prefix` replaces `file` when `split` is present. Output names are
  # <var>_<prefix>_<freq>_<StartTime>-<EndTime>.nc, variable first so that a
  # `pr_*.nc` glob selects one variable's whole time series.
  prefix: DeepESD
  split:
    by_variable: true     # one file per predictand (CORDEX requires this)
    years_per_file: 5     # daily: 5 (CORDEX cap); monthly: 10; sub-daily: 1
  template: path_to_your_template.nc # Optional, if not returns a xr with dims: time, point
  # formatting:
  #   name: null # e.g., cordex_ml
  #   kwargs:
  #     attributes_dict:
  #       project_id: ...

# Chunk boundaries follow the CORDEX grid rather than a fixed 5-year stride:
# files start on a year ending in '1' or '6' and end on one ending in '5' or
# '0', so ragged chunks appear only at the ends of the requested period. The
# years above therefore produce:
#
#   pr_DeepESD_day_19800101-19801231.nc   <- ragged: 1980 cannot start a chunk
#   pr_DeepESD_day_19810101-19851231.nc   <- aligned
#   pr_DeepESD_day_19860101-19861231.nc   <- ragged: end of the request
#
# Reassemble with:
#   xr.open_mfdataset("pr_DeepESD_day_*.nc", combine="by_coords")
#
# Omit the `split` block entirely (and keep `file:`) for the legacy single-file
# output — that path is unchanged and is still what ml-evaluation expects.
