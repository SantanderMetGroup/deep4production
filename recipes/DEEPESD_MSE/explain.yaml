# Gradient input-attribution (XAI) for a deterministic DeepESD (MSE) checkpoint.
# Run with:  d4p-explain ./explain.yaml   (from this DEEPESD_MSE run directory)
# Attribution targets the model's direct output channel for `target_var`, so it
# is only valid for DETERMINISTIC (MSE / asym) regressors — NOT for BerGamma /
# Gaussian NLL checkpoints (the explainer will refuse those).
#
# Same run directory as training: id_dir = output_dir/run_ID. The checkpoint is
# read from id_dir/outputs/models/ and maps are written to id_dir/outputs/xai/.
# Both keys are REQUIRED (there is no standalone id_dir key).
run_ID: DEEPESD_MSE
output_dir: path/to/your/project        # e.g. /gpfs/.../projects/CORDEX-BENCH

input_data:
  paths:
  - path_to_your_x_file.zarr     # UPSRCM*.zarr (perfect) or GCM*.zarr (imperfect)
  years: [1980]
  load_in_memory: true

graph:
ensemble_size: 1

model_file: DeepESD_Mse_best.pt  # Model at: id_dir/outputs/models/

saving_info:
  file: xai_1980.nc              # Saved at: id_dir/outputs/xai/
  template: path_to_your_template.nc   # Optional; lets the explainer mask NaN gridpoints

# DeepESD forward is model(x, f) → the base Explainer handles it (no subclass).
d4p_explainer:
  name: Explainer
  module: deep4production.core.explainers.explainer

# Forwarded as **kwargs to Explainer.explain().
explain_params:
  method: gradient               # gradient | integrated-gradients (not implemented)
  target_var: pr                 # predictand whose response is differentiated
  reduction: mean                # mean | sum  over the target region
  input_space: normalized        # normalized (unit-comparable) | raw (physical predictor units)
  target_space: physical         # physical (denormalised — comparable across models) | model
  percent: true                  # also emit saliency_percent / channel_contribution_percent
  batch_size: 8
  # Predictand box / gridpoint the gradient is computed over. Choose ONE style:
  #   whole valid domain:   {type: all}
  #   index box:            {type: box, i: [40, 88], j: [40, 88]}   (half-open, numpy-style)
  #   single gridpoint:     {type: point, i: 64, j: 64}
  #   geographic box:       {type: box, lat: [44, 48], lon: [5, 15]}  (needs 1D lats_y/lons_y)
  #   geographic point:     {type: point, lat: 46.0, lon: 10.0}
  target_region:
    type: box
    i: [40, 88]
    j: [40, 88]
